<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>IDEA CREATORS</title>
    <link rel="shortcut icon" type="image/x-icon" href="/logo.ico">
    <link rel="shortcut icon" type="image/x-icon" href="/logo_dark.ico" media="(prefers-color-scheme: dark)">
    <link rel="shortcut icon" type="image/x-icon" href="/logo.ico" media="(prefers-color-scheme: light)">
    <meta property="og:url" content="https://qpi.kro.kr/">
    <meta property="og:title" content="쿼터파이">
    <meta property="og:type" content="website">
    <meta property="og:image" content="/logo.png"> 
    <meta property="og:description" content="쿼터파이">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/colors.css">
    <link rel="stylesheet" href="newstyle.css">
    <style>
        @font-face {
            font-family: 'ArittaDodum';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_one@1.0/Arita-dotum-Medium.woff') format('woff');
            font-weight: normal;
            font-display: swap;
        }
        .hero {
            background: linear-gradient(150deg, #10004C 0%, #5F6584 100%);
        }
        .grid-item.accent-1 {
            background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.7)), url('/a1.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: var(--c-ltext);
        }

        .grid-item.accent-2 {
            background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.7)), url('/a2.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: var(--c-ltext);
        }
        .hero {
            background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.7)), url('/index.jpg');
            background-size: cover;
            background-position: center center;
        }
        .grid-item.large {
            grid-column: span 2;
            min-height: 300px;
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.7)), url('/main.jpg');
            color: var(--c-ltext);
        }
    </style>
    <script src="/nav.js" defer></script>
</head>
<body>
    <div class="nav-wrapper">
        <nav class="nav">
            <a href="/" class="nav-logo">ICL</a>
            <div class="nav-links">
                <a href="/" class="nav-link">홈</a>
                <a href="/search" class="nav-link">위치 검색</a>
                <a href="/howto" class="nav-link">기기 사용법</a>
            </div>
        </nav>
    </div>

    <main>
        <!-- 영웅 부분 -->
        <section class="hero">
            <div class="hero-content">
                <img src="inf.png" alt="무한상상" class="hero-eyebrow typography-caption2 en" style="width: 5vh;">
                <h1 class="hero-headline typography-title1">무한상상</h1>
                <p class="hero-subheadline typography-subheadline">IDEA CREATORS</p>
                <div class="hero-cta">
                    <a href="/search/" class="hero-link typography-body">위치 검색</a>
                    <a href="/howto/" class="hero-link typography-body">기기 사용법</a>
                </div>
            </div>
        </section>

        <!-- 생성물 칸칸 -->
        <section class="product-grid">
            <div class="grid-container">
                <div class="grid">
                    <div class="grid-item large">
                        <div class="item-eyebrow typography-caption2 en">무한상상</div>
                        <h2 class="item-headline typography-headline">메이커 동아리</h2>
                        <p class="item-description typography-caption1">
                            무한상상은 충남과학고등학교의 메이커 동아리입니다.
                        </p>
                        <div class="item-cta">
                            <a href="/about/" class="cta-link typography-caption1">더 알아보기 →</a>
                        </div>
                    </div>
                </div>

                <div class="grid">
                    <div class="grid-item accent-1">
                        <div class="item-eyebrow typography-caption2 en">지원</div>
                        <h2 class="item-headline typography-headline">위치 검색</h2>
                        <p class="item-description typography-caption1">
                            무한상상실의 공구, 기기, 소모품 등의 위치를 찾아보세요.
                        </p>
                        <div class="item-cta">
                            <a href="/search/" class="cta-link typography-caption1">자세히 알아보기 →</a>
                        </div>
                    </div>

                    <div class="grid-item accent-2">
                        <div class="item-eyebrow typography-caption2 en">지원</div>
                        <h2 class="item-headline typography-headline">기기 사용법</h2>
                        <p class="item-description typography-caption1">
                            무한상상실의 기기 사용법을 알아보세요.
                        </p>
                        <div class="item-cta">
                            <a href="/howto/" class="cta-link typography-caption1">자세히 알아보기 →</a>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 부분에 관하여 -->
        <section class="about-section">
            <div class="about-container">
                <h2 class="about-headline typography-title3 fade-up"></h2>
                <p class="about-description typography-body fade-up delay-1">
                    여러분의 무한한 상상력을 응원합니다.
                </p>
            </div>
        </section>

        <!-- 발 꼬랑지 -->
        <footer class="footer">
            <div class="footer-content">
                <p class="footer-text typography-footnote">2025 무한상상 | IDEA CREATORS</p>
                <p class="footer-text typography-footnote" style="font-size: xx-small;">
                    Powered by QPI
                </p>
            </div>
        </footer>
    </main>

    <script>            
        // 위아래 왔다갔다 움직임 교차 관찰자
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, observerOptions);

        // 나타나고, 칸 객체인 모든 원소 관찰
        document.querySelectorAll('.fade-up, .grid-item').forEach(el => {
            observer.observe(el);
        });

        // 고정 연결을 위한 부드러운 위아래 왔다갔다 움직임
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                }
            });
        });
    </script>
</body>
</html>
